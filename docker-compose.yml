version: '3.8'

services:
  app:
    image: ${APP_IMAGE:-sistem-event-kampus:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Application Configuration
      - APP_NAME="Sistem Event Kampus"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${PROD_APP_URL:-https://sistem-event.pbjt.web.id}
      - APP_KEY=${PROD_APP_KEY}
      
      # Database Configuration
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-event_kampus}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${PROD_DB_PASSWORD}
      
      # Optimization
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
    volumes:
      - storage_data:/var/www/html/storage/app/public
    networks:
      - ingress_network
      - backend_network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      placement:
        constraints:
          - node.hostname == swarm-manager
      restart_policy:
        condition: any

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-event_kampus}
      - MYSQL_ROOT_PASSWORD=${PROD_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.10'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
          - node.hostname == swarm-manager

volumes:
  mysql_data:
  storage_data:

networks:
  ingress_network:
    external: true
  backend_network:
