name: Deploy to Swarm

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase automatically
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login using the built-in GITHUB_TOKEN (No GHCR_PAT needed here, but GHCR_PAT is needed for pulling on the VM)
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

  deploy-to-swarm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.68.1

      - name: Prepare Compose file for SSH
        id: prepare_compose
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "COMPOSE_CONTENT<<$EOF" >> $GITHUB_ENV
          cat docker-compose.yml >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_CONTENT: ${{ env.COMPOSE_CONTENT }}
          PROD_APP_KEY: ${{ secrets.PROD_APP_KEY }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          APP_IMAGE: ghcr.io/nisrinasalwamuadzah-ui/sistem-event-kampus:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: COMPOSE_CONTENT,PROD_APP_KEY,PROD_DB_PASSWORD,PROD_APP_URL,DB_DATABASE,DB_USERNAME,APP_IMAGE
          script: |
            # Buat direktori dan masuk ke dalamnya
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Tulis file docker-compose.yml tanpa SCP (bypass SCP bugs)
            echo "$COMPOSE_CONTENT" > docker-compose.yml
            
            # Login ke GHCR di dalam VM agar bisa pull image private
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Tarik image terbaru
            docker pull $APP_IMAGE
            
            # Export semua secret sebagai environment variable di terminal VM
            export PROD_APP_KEY=$PROD_APP_KEY
            export PROD_DB_PASSWORD=$PROD_DB_PASSWORD
            export PROD_APP_URL=$PROD_APP_URL
            export DB_DATABASE=$DB_DATABASE
            export DB_USERNAME=$DB_USERNAME
            export APP_IMAGE=$APP_IMAGE
            
            # Pastikan network eksternal sudah ada sebelum deploy
            docker network create -d overlay front-tier || true
            
            # Deploy stack (Swarm akan otomatis membaca environment variables di atas)
            docker stack deploy -c docker-compose.yml sistem-event
            
            # Tunggu beberapa saat agar container baru naik
            echo "Waiting for containers to start..."
            sleep 15
            
            # Cari container app yang berjalan dan paksa jalankan migrasi database
            CONTAINER_ID=$(docker ps -q -f name=sistem-event_app | head -n 1)
            if [ ! -z "$CONTAINER_ID" ]; then
                echo "Running migrations on container $CONTAINER_ID..."
                docker exec $CONTAINER_ID php artisan migrate --force
            else
                echo "Warning: Could not find running app container to run migrations."
            fi
